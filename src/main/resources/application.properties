spring.application.name=MiniRemittApp

spring.datasource.url=jdbc:postgresql://localhost:5433/remitflow
spring.datasource.username=${DB_USERNAME:remitflow}
spring.datasource.password=${DB_PASSWORD:remitflow_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.hikari.connection-timeout=3000

