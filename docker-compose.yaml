services:
  postgres:
    image: postgres:17
    container_name: remitflow-postgres
    environment:
      POSTGRES_DB: remitflow
      POSTGRES_USER: remitflow
      POSTGRES_PASSWORD: remitflow_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: